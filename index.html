/* Campus beacons and pointer-reactive frosted glass. */
body{background:radial-gradient(ellipse at 12% 32%,#344039 0,transparent 34%),radial-gradient(ellipse at 90% 67%,#3a353e 0,transparent 36%),#161c1a}
header nav,.hero .ghost,#stations .station,.overview,.card,.lab,.team,.contact,dialog{
  border:1px solid #e9f7ef42;
  background-color:#ffffff12;
  backdrop-filter:blur(18px) saturate(1.22);
  box-shadow:inset 0 1px #fff3,0 16px 52px #080e1240;
}
#stations .station{background:#182421bc}
.lab,.team,.contact{background-image:linear-gradient(135deg,#c5e9d51b,#ebd4f30a)}
.card{transform:perspective(880px) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));transform-style:preserve-3d;transition:transform .23s ease-out,border-color .3s}
.card img{inset:0 0 auto;height:88%}
.card:after{background:linear-gradient(0deg,#14201de8 4%,#172120ab 48%,transparent 80%)}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at var(--light-x,50%) var(--light-y,50%),#f8ffff2f,transparent 48%);opacity:0;transition:opacity .28s}
.card:hover::before{opacity:1}
.campus-poster{transform:scale(1.025) translate3d(var(--hero-x,0px),var(--hero-y,0px),0);transition:transform .4s ease-out}
.campus-lights{position:absolute;inset:0;z-index:-1;pointer-events:none;transform:scale(1.025) translate3d(var(--hero-x,0px),var(--hero-y,0px),0);transition:transform .4s ease-out}
.campus-lights i{position:absolute;width:19px;height:9px;border:1px solid var(--neon);border-radius:50%;color:var(--neon);box-shadow:0 0 14px currentColor,0 0 32px currentColor;transform:translate(-50%,-50%);animation:beacon 3.7s ease-in-out infinite alternate}
.campus-lights i::before{content:'';position:absolute;bottom:50%;left:50%;height:58px;width:1px;background:linear-gradient(transparent,currentColor)}
.campus-lights i:nth-child(1){--neon:#71ffc7}
.campus-lights i:nth-child(2){--neon:#7fe7ff;animation-delay:-1.3s}
.campus-lights i:nth-child(3){--neon:#d3acff;animation-delay:-2.6s}
.is-exploring .campus-lights{visibility:hidden}
@keyframes beacon{from{opacity:.58}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.card,.campus-poster,.campus-lights{transform:none}.campus-lights i{animation:none}}

const hero=document.querySelector('.hero');
const poster=hero.querySelector('.campus-poster');
const beacons=hero.querySelectorAll('.campus-lights i');
const landmarks=[[.31,.58],[.53,.38],[.88,.45]];
function alignBeacons(){
  if(!poster.naturalWidth)return;
  const width=poster.clientWidth,height=poster.clientHeight;
  const scale=Math.max(width/poster.naturalWidth,height/poster.naturalHeight);
  const imageWidth=poster.naturalWidth*scale,imageHeight=poster.naturalHeight*scale;
  const position=getComputedStyle(poster).objectPosition.split(' ').map(value=>parseFloat(value)/100);
  landmarks.forEach(([x,y],index)=>{
    beacons[index].style.left=((width-imageWidth)*position[0]+imageWidth*x)+'px';
    beacons[index].style.top=((height-imageHeight)*position[1]+imageHeight*y)+'px';
  });
}
